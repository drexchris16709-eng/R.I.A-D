<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png"href="Logo.jpg"><title>R.I.A</title>
<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="app-card">
    <div class="banner-container">
      <img 
        src="B.jpg" 
        onerror="this.onerror=null; this.src='banner.png';" 
        alt="Header Banner" 
        class="banner-img"/>

      <button class="cs-btn" id="openCsModal" type="button" aria-label="Customer Support">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
          <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
        </svg>
      </button>

      <div class="logo-container">
        <img 
          src="Logo.jpg" 
          onerror="this.onerror=null; this.src='logo.png';" 
          alt="Logo"/>
      </div>
    </div>

    <div class="content">
      <div class="header-row">
        <h1>Welcome Teacher</h1>
<button class="info-btn" id="openInfoModal" type="button">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22">
    <circle cx="12" cy="12" r="10"></circle>
    <line x1="12" y1="16" x2="12" y2="12"></line>
    <line x1="12" y1="8" x2="12.01" y2="8"></line>
  </svg>
</button>
        </button>
      </div>
      <p class="subtitle">Sign in to continue to your dashboard</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="lrn">Contact No.</label>
          <div class="input-wrapper">
            <input type="text" id="lrn" name="lrn" required autocomplete="off" />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password:</label>
          <div class="input-wrapper">
            <input type="password" id="password" name="password" required />
            <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
                <line x1="3" y1="21" x2="21" y2="3" class="eye-slash-line" stroke-linecap="round"></line>
              </svg>
            </button>
          </div>
        </div>

        <div class="error-msg" id="errorMsg">Invalid LRN or Password. Please try again.</div>

        <div class="passkey-container">
<a href="passkey.html" class="passkey-link">
  Passkey
  <svg id="passkeyArrow" width="24" height="24" viewBox="0 0 24 24" fill="none">
    <path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</a>
        </div>

        <div class="action-row">
          <a href="forgot-password.html" class="forgot-link">Forget Password</a>
          <button type="submit" class="login-btn">Login</button>
        </div>
      </form>
    </div>

    <div class="modal-overlay" id="infoModal">
      <div class="modal-box">
        <button class="modal-close" id="closeInfoModal">&times;</button>
        <h3>Student Portal Info</h3>
        <p>Please enter your 11-digit Contact Number and password to access your teacher dashboard.</p>
      </div>
    </div>

    <div class="modal-overlay" id="csModal">
      <div class="modal-box">
        <button class="modal-close" id="closeCsModal">&times;</button>
        <h3>Customer Service</h3>
        <p>Coming Soon</p>
      </div>
    </div>
  </div>

    <script src="script.js"></script>

</body>
</html>
